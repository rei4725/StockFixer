[pytest]
markers =
    unit: Unit tests (no external dependencies, fast)
    integration: Integration tests (require DB, yfinance, etc.)
    slow: Slow tests that run actual CLI commands or require heavy resources
testpaths = tests
pythonpath = .
# basetemp は tests/conftest.py の pytest_configure が実行毎に
# .pytest_tmp_runs/local_<stamp>_<pid> を割り当てる（固定値は指定しない。
# 明示 --basetemp は pytest が起動時に無条件 rm_rf するため、共有ルートを
# 直接指定すると削除不能な残骸に当たった時点で全テストが ERROR 化する）。
addopts = --timeout=30
