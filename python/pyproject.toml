[tool.black]
line-length = 100
# .pytest_tmp_runs は昇格デプロイタスクが生成する一時ディレクトリで、
# 非昇格プロセスからは読めず black のファイル走査が PermissionError で落ちる
force-exclude = '\.pytest_tmp_runs'

[tool.isort]
profile = "black"
line_length = 100
src_paths = ["src"]
known_first_party = ["config", "src"]

[tool.mypy]
# グローバル設定（既存の pre-commit args と同一）
ignore_missing_imports = true
implicit_optional = true
follow_imports = "silent"
explicit_package_bases = true

# src/trading・src/backtest BC のみ段階的に strict を有効化（Issue #155 で対応中）
# mypy 2.1.0 での strict モードは既存コードに多くのエラーを引き起こすため一時的に無効化
[[tool.mypy.overrides]]
module = [
    "src.trading",
    "src.trading.*",
    "src.backtest",
    "src.backtest.*",
]
ignore_missing_imports = true
implicit_optional = true

# 既存の型エラーが多いモジュール（段階的に修正予定）
[[tool.mypy.overrides]]
module = [
    "src.prediction.models.*",
    "src.prediction.training_pipeline",
    "src.prediction.training_pipeline.*",
    "src.prediction.unified_model_pipeline",
    "src.market_data.pipeline",
]
ignore_errors = true
