name: Experiments CI

on:
  pull_request:
    paths:
      - "python/experiments/**"
      - ".github/workflows/experiments.yml"
  push:
    branches:
      - develop
    paths:
      - "python/experiments/**"
      - ".github/workflows/experiments.yml"

jobs:
  lint:
    name: Lint (black / isort)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install lint tools
        run: pip install black isort

      - name: black
        run: python -m black experiments/ --check

      - name: isort
        run: python -m isort experiments/ --check

  security:
    name: Security Scan (bandit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install bandit
        run: pip install bandit

      - name: Run bandit scan
        run: |
          if find experiments/ -name "*.py" | grep -q .; then
            bandit -r experiments/ -ll --format json -o bandit-experiments.json || true
          else
            echo '{"results": [], "errors": []}' > bandit-experiments.json
          fi

      - name: Parse results and set exit code
        run: |
          python - << 'EOF'
          import json, sys, os

          with open("bandit-experiments.json") as f:
              report = json.load(f)

          results = report.get("results", [])
          high = [r for r in results if r["issue_severity"] == "HIGH"]

          summary = os.environ.get("GITHUB_STEP_SUMMARY", "/dev/null")
          with open(summary, "a") as s:
              s.write("## Bandit Results (experiments)\n\n")
              if high:
                  s.write(f"### :x: HIGH severity ({len(high)} findings)\n\n")
                  for r in high:
                      s.write(f"- `{r['filename']}:{r['line_number']}` — {r['test_id']}: {r['issue_text']}\n")
              else:
                  s.write(":white_check_mark: No HIGH severity issues found.\n")

          if high:
              print(f"::error::bandit detected {len(high)} HIGH severity issue(s). Failing.")
              sys.exit(1)
          else:
              print("No HIGH severity issues found.")
          EOF
