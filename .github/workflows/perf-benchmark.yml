name: Performance Benchmark

on:
  # develop へのマージ後にのみ実行する。PR時に実行しないのは、性能劣化は
  # 循環依存等と違って「本番でしばらく動いても致命的ではない」性質のため、
  # PRのCI待ち時間短縮を優先する判断（unit/integration/e2e はPRブロッキングを維持）。
  push:
    branches:
      - develop
    paths:
      - "python/**"
      - ".github/workflows/perf-benchmark.yml"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            python/requirements.txt
            python/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # mlflow>=3.12.0 は pandas<3 を要求するため requirements.txt に競合がある。
          # mlflow を --no-deps で別途インストールすることで競合を回避する。
          grep -v '^mlflow' requirements.txt | pip install -r /dev/stdin
          pip install "mlflow>=3.12.0" --no-deps
          pip install -r requirements-dev.txt

      - name: Restore previous benchmark results
        id: cache-restore
        uses: actions/cache/restore@v6
        with:
          path: python/tests/perf/benchmark_results.json
          key: perf-benchmark-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            perf-benchmark-refs/heads/develop-
            perf-benchmark-

      - name: Copy baseline for comparison
        shell: bash
        run: |
          if [ -f tests/perf/benchmark_results.json ]; then
            cp tests/perf/benchmark_results.json tests/perf/benchmark_results_prev.json
            echo "ベースライン benchmark_results_prev.json をコピーしました"
          else
            echo "ベースラインなし（初回実行）"
          fi

      - name: Run performance benchmarks with durations
        shell: bash
        run: |
          python -m pytest tests/perf/ --durations=20 -v 2>&1 | tee perf_output.txt
          echo "EXIT_CODE=${PIPESTATUS[0]}" >> "$GITHUB_ENV"

      - name: Write benchmark results to Step Summary
        if: always()
        shell: bash
        run: |
          echo "## :stopwatch: パフォーマンスベンチマーク結果" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f tests/perf/benchmark_results.json ]; then
            echo "### 計測結果 (benchmark_results.json)" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat tests/perf/benchmark_results.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### pytest --durations=20 出力" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "slowest|PASSED|FAILED|ERROR|seconds" perf_output.txt | head -60 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Check for performance regression
        id: regression-check
        shell: bash
        run: |
          python tests/perf/check_regression.py
          echo "REGRESSION_FOUND=false" >> "$GITHUB_ENV"
        continue-on-error: true

      - name: Append regression warning to Step Summary
        if: steps.regression-check.outcome == 'failure'
        shell: bash
        run: |
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f regression_warning.txt ]; then
            cat regression_warning.txt >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## ⚠️ パフォーマンスリグレッション検出"
              echo ""
              echo "前回比 20% 以上遅くなったベンチマークがあります。調査してください。"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Save benchmark results to cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: python/tests/perf/benchmark_results.json
          key: perf-benchmark-${{ github.ref }}-${{ github.sha }}
