name: Auto Release on VERSION change

on:
  push:
    branches:
      - develop
    paths:
      - "VERSION"

jobs:
  create-release:
    name: Tag and create GitHub Release (draft)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      skip: ${{ steps.tag_check.outputs.exists }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read VERSION
        id: ver
        run: |
          version=$(cat VERSION | tr -d '[:space:]')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: tag_check
        run: |
          if git tag --list | grep -qx "${{ steps.ver.outputs.tag }}"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect changelog (commits since last tag)
        if: steps.tag_check.outputs.exists == 'false'
        id: changelog
        run: |
          last_tag=$(git tag --sort=-creatordate | head -n 1)
          if [ -z "$last_tag" ]; then
            range="HEAD"
          else
            range="${last_tag}..HEAD"
          fi

          log=$(git log "$range" --pretty=format:"- %s (%h)" --no-merges | head -50)
          if [ -z "$log" ]; then
            log="- (変更履歴なし)"
          fi

          {
            echo "log<<ENDOFLOG"
            echo "$log"
            echo "ENDOFLOG"
          } >> "$GITHUB_OUTPUT"

      - name: Create tag and GitHub Release
        if: steps.tag_check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.ver.outputs.tag }}"
          version="${{ steps.ver.outputs.version }}"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Release $tag"
          git push origin "$tag"

          gh release create "$tag" \
            --title "Release $version" \
            --notes "${{ steps.changelog.outputs.log }}" \
            --draft

      - name: Set up Python
        if: steps.tag_check.outputs.exists == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate SBOM
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          pip install --quiet -r python/requirements.txt
          pip install --quiet cyclonedx-bom
          cyclonedx-py environment -o sbom.json

      - name: Upload SBOM to release
        if: steps.tag_check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.ver.outputs.tag }}" sbom.json --clobber

  publish-release:
    name: Wait for CI checks and publish release
    needs: create-release
    if: needs.create-release.outputs.skip == 'false'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Wait for CI workflows to complete
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          workflows=("unit-tests.yml" "integration-tests.yml" "security.yml")
          timeout=1800
          interval=30
          elapsed=0

          while [ $elapsed -lt $timeout ]; do
            all_done=true

            for wf in "${workflows[@]}"; do
              run=$(gh api "repos/$REPO/actions/workflows/$wf/runs?head_sha=$SHA&per_page=1" \
                --jq '.workflow_runs[0] | {status: .status, conclusion: .conclusion}' 2>/dev/null || echo 'null')

              status=$(echo "$run" | jq -r '.status // "not_triggered"')
              conclusion=$(echo "$run" | jq -r '.conclusion // ""')

              if [ "$status" = "not_triggered" ] || [ "$run" = "null" ]; then
                echo "$wf: not triggered for this commit, skipping"
              elif [ "$status" != "completed" ]; then
                echo "$wf: in progress (status=$status)"
                all_done=false
              elif [ "$conclusion" = "success" ]; then
                echo "$wf: passed"
              else
                echo "::error::$wf failed (conclusion=$conclusion)"
                exit 1
              fi
            done

            $all_done && break
            sleep $interval
            elapsed=$((elapsed + interval))
          done

          if [ $elapsed -ge $timeout ]; then
            echo "::error::Timed out waiting for CI checks after ${timeout}s"
            exit 1
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ needs.create-release.outputs.tag }}" --draft=false
          echo "Published release ${{ needs.create-release.outputs.tag }}"
