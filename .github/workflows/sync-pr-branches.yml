name: Sync Auto PR Branches with develop

on:
  push:
    branches: [develop]
    paths:
      - "python/**"

jobs:
  sync:
    name: Merge develop into open auto PRs
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Merge develop into open auto PR branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branches=$(gh pr list --state open \
            --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("auto/")) | .headRefName] | .[]' \
            2>/dev/null)

          if [ -z "$branches" ]; then
            echo "No open auto PR branches found."
            exit 0
          fi

          updated=0
          skipped=0
          for branch in $branches; do
            echo "--- $branch ---"

            # リモートブランチが develop と乖離していなければスキップ
            git fetch origin "$branch" 2>/dev/null || { echo "  fetch failed, skipping"; ((skipped++)); continue; }
            behind=$(git rev-list --count "origin/$branch..origin/develop" 2>/dev/null || echo "0")
            if [ "$behind" = "0" ]; then
              echo "  already up to date, skipping"
              continue
            fi
            echo "  $behind commit(s) behind develop"

            git checkout -B "$branch" "origin/$branch" 2>/dev/null || { echo "  checkout failed, skipping"; ((skipped++)); continue; }

            if git merge --no-edit origin/develop 2>&1; then
              git push origin "$branch" && echo "  ✓ pushed" && ((updated++)) || { echo "  push failed"; ((skipped++)); }
            else
              git merge --abort 2>/dev/null || true
              echo "  ⚠ conflict, skipping"
              ((skipped++))
            fi
          done

          echo ""
          echo "Result: updated=$updated skipped=$skipped"
