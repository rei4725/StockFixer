name: Import Linter Check

on:
  pull_request:
    paths:
      - "python/src/**"
      - "python/.importlinter"
      - ".github/workflows/import-linter-check.yml"
  push:
    branches:
      - develop
    paths:
      - "python/src/**"
      - "python/.importlinter"

jobs:
  import-linter:
    name: Architecture Contract Check (import-linter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install import-linter
        run: |
          python -m pip install --upgrade pip
          pip install "import-linter>=2.0"

      - name: Run lint-imports
        run: lint-imports

      - name: Report result
        if: failure()
        run: |
          echo "::error::Architecture contract violations detected."
          echo "Run 'lint-imports' in python/ to see details."
          echo "To add a legitimate exception, update python/.importlinter with a comment explaining why."
