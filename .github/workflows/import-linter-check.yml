name: Import Linter Check

on:
  pull_request:
    paths:
      - "python/src/**"
      - "python/.importlinter"
      - ".github/workflows/import-linter-check.yml"
  push:
    branches:
      - develop
    paths:
      - "python/src/**"
      - "python/.importlinter"

jobs:
  import-linter:
    name: Architecture Contract Check (import-linter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install import-linter
        run: |
          python -m pip install --upgrade pip
          pip install "import-linter>=2.0"

      - name: Run lint-imports
        run: lint-imports

      - name: Check ignore_imports count does not increase
        run: |
          BASE_REF="${{ github.event.pull_request.base.sha || github.event.before }}"
          CURRENT_COUNT=$(grep -c '^\s*src\.' .importlinter || true)
          echo "Current ignore_imports count: $CURRENT_COUNT"
          if [ -n "$BASE_REF" ] && git cat-file -e "$BASE_REF:.importlinter" 2>/dev/null; then
            BASE_COUNT=$(git show "$BASE_REF:.importlinter" | grep -c '^\s*src\.' || true)
            echo "Base ignore_imports count: $BASE_COUNT"
            if [ "$CURRENT_COUNT" -gt "$BASE_COUNT" ]; then
              echo "::warning::ignore_imports が $BASE_COUNT → $CURRENT_COUNT 件に増加しました。BC 間の依存追加は最終手段です。"
            fi
          fi

      - name: Report result
        if: failure()
        run: |
          echo "::error::Architecture contract violations detected."
          echo "Run 'lint-imports' in python/ to see details."
          echo "To add a legitimate exception, update python/.importlinter with a comment explaining why."
