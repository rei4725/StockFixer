name: Unit Tests

on:
  pull_request:
    paths:
      - "python/**"
      - ".github/workflows/unit-tests.yml"
  push:
    branches:
      - develop
    paths:
      - "python/**"
      - ".github/workflows/unit-tests.yml"

jobs:
  lint:
    name: Lint (black / isort / flake8 / mypy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: black
        run: python -m black . --check

      - name: isort
        run: python -m isort . --check

      - name: flake8
        run: python -m flake8 .

      - name: mypy
        run: python -m mypy src/ --ignore-missing-imports --implicit-optional

  unit-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Pylint (errors only)
        run: python -m pylint src/ --rcfile=.pylintrc

      - name: Run unit tests with coverage gate
        run: python -m pytest tests/unit/ -v --cov=src --cov-branch --cov-report=term-missing --cov-fail-under=70
