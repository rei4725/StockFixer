name: Unit Tests

on:
  pull_request:
  push:
    branches:
      - develop
    paths:
      - "python/**"
      - "!python/experiments/**"
      - ".github/workflows/unit-tests.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint (black / isort / flake8 / mypy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: python/requirements-dev.txt

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: black
        run: python -m black . --check

      - name: isort
        run: python -m isort . --check

      - name: flake8
        run: python -m flake8 .

      - name: mypy
        run: python -m mypy src/ --ignore-missing-imports --implicit-optional

  unit-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: stockfixer
          POSTGRES_USER: stockfixer
          POSTGRES_PASSWORD: stockfixer_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stockfixer -d stockfixer"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://stockfixer:stockfixer_ci@localhost:5432/stockfixer

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            python/requirements.txt
            python/requirements-dev.txt
            python/requirements-service.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # mlflow>=3.12.0 は pandas<3 を要求するため requirements.txt に競合がある。
          # mlflow を --no-deps で別途インストールすることで競合を回避する。
          grep -v '^mlflow' requirements.txt | pip install -r /dev/stdin
          pip install "mlflow>=3.12.0" --no-deps
          pip install -r requirements-dev.txt
          pip install -r requirements-service.txt

      - name: Pylint (errors only)
        run: python -m pylint src/ --rcfile=.pylintrc

      - name: Run unit tests with coverage gate
        # LightGBM/XGBoost を実学習させる回帰テスト(#615)は、xdist の並列ワーカー間で
        # ネイティブ拡張の内部処理が競合し、CPUが限られたCI環境ではワーカー数を
        # 絞っても・n_jobs=1に固定しても flaky 化することを確認したため、このファイルだけ
        # 並列実行から除外し直列で実行する（カバレッジは --cov-append で合算）。
        run: |
          python -m pytest tests/unit/ -n 2 -v \
            --ignore=tests/unit/test_predict_unified_lightgbm_alignment.py \
            --cov=src --cov-branch --cov-report= --cov-fail-under=0
          python -m pytest tests/unit/test_predict_unified_lightgbm_alignment.py -v \
            --cov=src --cov-branch --cov-append --cov-report=term-missing --cov-fail-under=80
