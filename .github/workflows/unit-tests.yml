name: Unit Tests

on:
  pull_request:
    paths:
      - "python/**"
      - ".github/workflows/unit-tests.yml"
  push:
    branches:
      - develop
    paths:
      - "python/**"
      - ".github/workflows/unit-tests.yml"

jobs:
  unit-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Pylint (errors only)
        run: python -m pylint src/ --rcfile=.pylintrc

      - name: Run unit tests with coverage gate
        run: python -m pytest tests/unit/ -v --cov=src --cov-branch --cov-report=term-missing --cov-fail-under=70
