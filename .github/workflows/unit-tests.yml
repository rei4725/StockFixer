name: Unit Tests

on:
  pull_request:
  push:
    branches:
      - develop
    paths:
      - "python/**"
      - "!python/experiments/**"
      - ".github/workflows/unit-tests.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (black / isort / flake8 / mypy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: black
        run: python -m black . --check

      - name: isort
        run: python -m isort . --check

      - name: flake8
        run: python -m flake8 .

      - name: mypy
        run: python -m mypy src/ --ignore-missing-imports --implicit-optional

  unit-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: stockfixer
          POSTGRES_USER: stockfixer
          POSTGRES_PASSWORD: stockfixer_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stockfixer -d stockfixer"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://stockfixer:stockfixer_ci@localhost:5432/stockfixer

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # mlflow>=3.12.0 は pandas<3 を要求するため requirements.txt に競合がある。
          # mlflow を --no-deps で別途インストールすることで競合を回避する。
          grep -v '^mlflow' requirements.txt | pip install -r /dev/stdin
          pip install "mlflow>=3.12.0" --no-deps
          pip install -r requirements-dev.txt
          pip install -r requirements-service.txt

      - name: Pylint (errors only)
        run: python -m pylint src/ --rcfile=.pylintrc

      - name: Run unit tests with coverage gate
        run: python -m pytest tests/unit/ -v --cov=src --cov-branch --cov-report=term-missing --cov-fail-under=80
