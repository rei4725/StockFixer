name: Weekly Model Drift Check

on:
  schedule:
    # 毎週月曜 01:00 JST (= 日曜 16:00 UTC)
    - cron: "0 16 * * 0"
  workflow_dispatch:

jobs:
  drift-check:
    name: Check weekly Hit Rate drift
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run drift check
        id: drift
        working-directory: python
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python - << 'EOF'
          import json
          import os
          import sys

          sys.path.insert(0, ".")

          from config.settings import DRIFT_ALERT_THRESHOLD, DRIFT_ALERT_WEEKS
          from src.prediction.drift_monitor import check_weekly_hit_rate_drift
          from src.reporting.discord.discord_utils import send_hit_rate_drift_alert

          try:
              result = check_weekly_hit_rate_drift(
                  weeks=DRIFT_ALERT_WEEKS,
                  threshold=DRIFT_ALERT_THRESHOLD,
              )
          except Exception as e:
              print(f"::error::ドリフト検査失敗: {e}", flush=True)
              raise

          # GitHub Step Summary に結果を出力
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY", "/dev/null")
          with open(summary_path, "a", encoding="utf-8") as f:
              f.write("## Weekly Model Drift Check\n\n")
              f.write(f"- 検査日時: {result.checked_at}\n")
              f.write(f"- 当週: {result.current_week or 'N/A'}\n")
              hit = f"{result.current_hit_rate * 100:.1f}%" if result.current_hit_rate is not None else "N/A"
              avg = f"{result.avg_hit_rate * 100:.1f}%" if result.avg_hit_rate is not None else "N/A"
              drop = f"{result.drop_ratio * 100:.1f}%" if result.drop_ratio is not None else "N/A"
              f.write(f"- 当週 Hit Rate: {hit}\n")
              f.write(f"- 過去 {result.alert_weeks} 週平均: {avg}\n")
              f.write(f"- 低下率: {drop}\n")
              status = "**⚠️ ドリフト検知**" if result.is_drifted else "✅ 正常"
              f.write(f"- 判定: {status}\n")

          if result.is_drifted:
              send_hit_rate_drift_alert(result)
              print(f"::warning::Hit Rate ドリフト検知: 当週={hit} 過去平均={avg} 低下={drop}", flush=True)
          else:
              print(f"::notice::Hit Rate ドリフトなし: 当週={hit} 過去平均={avg}", flush=True)
          EOF
