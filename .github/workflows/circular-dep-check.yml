name: Circular Dependency Check

on:
  pull_request:
    paths:
      - "python/src/**"
      - ".github/workflows/circular-dep-check.yml"
  push:
    branches:
      - develop
    paths:
      - "python/src/**"
      - ".github/workflows/circular-dep-check.yml"

jobs:
  circular-dep-check:
    name: Circular Dependency Detection (pydeps)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # mlflow>=3.12.0 は pandas<3 を要求するため requirements.txt に競合がある。
          # pydeps の循環依存チェックには mlflow の実行は不要なため除外してインストールする。
          grep -v '^mlflow' requirements.txt | pip install -r /dev/stdin
          pip install "pydeps>=1.12.0"

      - name: Detect circular imports
        run: |
          python - << 'EOF'
          import os, subprocess, sys

          result = subprocess.run(
              ["pydeps", "src", "--show-cycles", "--no-output"],
              capture_output=True,
              text=True,
          )
          output = (result.stdout + result.stderr).strip()
          if output:
              print(output)

          cycles_found = result.returncode != 0 or "cycle" in output.lower()

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY", os.devnull)
          with open(summary_path, "a") as s:
              s.write("## Circular Dependency Check\n\n")
              if cycles_found:
                  s.write(f"### :x: Circular imports detected\n\n```\n{output}\n```\n")
              else:
                  s.write(":white_check_mark: No circular imports detected.\n")

          if cycles_found:
              print("::error::Circular dependencies detected. Fix before merging.")
              sys.exit(1)
          else:
              print("No circular imports detected.")
          EOF
