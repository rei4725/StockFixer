name: Weekly Watchlist Refresh

on:
  schedule:
    # 毎週金曜 01:00 JST (= 木曜 16:00 UTC)
    - cron: "0 16 * * 4"
  workflow_dispatch:

jobs:
  watchlist-refresh:
    name: Sync watchlist.json with S&P500 / Nikkei225
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # PRブランチを作成するためtokenが必要
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Python は run_watchlist_refresh.py に置く（yml に直書きするとテストも lint も通らず、
      # import の道が壊れても気づけない。#808）。指数銘柄の取得に失敗した市場があれば exit 1。
      # 片方の市場が失敗しても、もう片方の変更は PR にするため continue-on-error とし、
      # 最後の「Fail on refresh error」でジョブを赤にする
      - name: Run watchlist refresh
        id: refresh
        continue-on-error: true
        working-directory: python
        run: python run_watchlist_refresh.py

      - name: Check for changes
        id: diff
        run: |
          git diff --quiet python/config/watchlist.json || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Create PR if watchlist.json changed
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          date_str=$(date -u +%Y%m%d)
          branch="chore/watchlist-refresh-${date_str}"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$branch"
          git add python/config/watchlist.json
          # 監査ログも変更されていれば含める
          git diff --cached --quiet python/config/watchlist_audit_log.json 2>/dev/null \
            || git add python/config/watchlist_audit_log.json 2>/dev/null || true
          git commit -m "chore: weekly watchlist refresh (${date_str})"
          git push origin "$branch"

          gh pr create \
            --base develop \
            --head "$branch" \
            --title "chore: weekly watchlist refresh ${date_str}" \
            --body "## 変更内容

          GitHub Actions による週次ウォッチリスト自動更新。
          S&P500 / 日経225 の最新構成銘柄と \`watchlist.json\` を同期した。

          ## version_impact
          none

          ## version_rationale
          watchlist.json の自動同期はデータ設定変更であり、プロダクションコードへの変更は含まない。

          ## VERSION 更新
          - version_update_required: no
          - version_before:
          - version_after:

          ## VERSION 未更新理由
          watchlist.json のデータ設定の同期だけで、リリース対象のコードを含まないため。"

      - name: No changes
        if: steps.diff.outputs.changed != 'true'
        run: echo "watchlist.json に変更なし。PRは作成しません。"

      - name: Fail on refresh error
        if: steps.refresh.outcome == 'failure'
        run: |
          echo "::error::ウォッチリスト更新に失敗した（指数銘柄の取得失敗か例外。上の Run watchlist refresh のログと Step Summary を見る）"
          exit 1
