name: Security Scan

on:
  pull_request:
    paths:
      - "python/requirements*.txt"
      - "python/src/**"
      - ".github/workflows/security.yml"
  push:
    branches:
      - develop
    paths:
      - "python/requirements*.txt"
      - "python/src/**"
      - ".github/workflows/security.yml"
  schedule:
    - cron: "0 9 * * 1"

jobs:
  pip-audit:
    name: Dependency Vulnerability Scan (pip-audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit requirements.txt
        run: |
          pip-audit -r requirements.txt --format json -o pip-audit-prod.json || true

      - name: Audit requirements-dev.txt
        run: |
          pip-audit -r requirements-dev.txt --format json -o pip-audit-dev.json || true

      - name: Parse results and set exit code
        run: |
          python - << 'EOF'
          import json, sys, os

          def check_file(path, label):
              if not os.path.exists(path):
                  return []
              with open(path) as f:
                  data = json.load(f)
              vulns = []
              for dep in data.get("dependencies", []):
                  for v in dep.get("vulns", []):
                      vulns.append({
                          "name": dep["name"],
                          "version": dep.get("version", "?"),
                          "id": v["id"],
                          "aliases": v.get("aliases", []),
                          "description": v.get("description", ""),
                          "fix_versions": v.get("fix_versions", []),
                      })
              return vulns

          prod_vulns = check_file("pip-audit-prod.json", "requirements.txt")
          dev_vulns  = check_file("pip-audit-dev.json",  "requirements-dev.txt")
          all_vulns  = prod_vulns + dev_vulns

          summary = os.environ.get("GITHUB_STEP_SUMMARY", "/dev/null")
          with open(summary, "a") as s:
              s.write("## pip-audit Results\n\n")
              if all_vulns:
                  s.write(f"### :warning: {len(all_vulns)} vulnerability(ies) found\n\n")
                  for v in all_vulns:
                      fix = ", ".join(v["fix_versions"]) or "no fix available"
                      s.write(f"- **{v['name']}=={v['version']}** — {v['id']} (fix: {fix})\n")
                      if v["aliases"]:
                          s.write(f"  - aliases: {', '.join(v['aliases'])}\n")
              else:
                  s.write(":white_check_mark: No vulnerabilities found.\n")

          if all_vulns:
              print(f"::error::pip-audit detected {len(all_vulns)} vulnerability(ies). Failing.")
              sys.exit(1)
          else:
              print("No vulnerabilities found.")
          EOF

  bandit:
    name: SAST Scan (bandit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install bandit
        run: pip install bandit

      - name: Run bandit scan
        run: |
          bandit -r src/ -ll --exclude src/_deprecated --format json -o bandit-report.json || true

      - name: Parse results and set exit code
        run: |
          python - << 'EOF'
          import json, sys, os

          with open("bandit-report.json") as f:
              report = json.load(f)

          results = report.get("results", [])
          high    = [r for r in results if r["issue_severity"] == "HIGH"]
          medium  = [r for r in results if r["issue_severity"] == "MEDIUM"]

          summary = os.environ.get("GITHUB_STEP_SUMMARY", "/dev/null")
          with open(summary, "a") as s:
              s.write("## Bandit SAST Results\n\n")
              if medium:
                  s.write(f"### :warning: MEDIUM severity ({len(medium)} findings)\n\n")
                  for r in medium:
                      s.write(f"- `{r['filename']}:{r['line_number']}` — {r['test_id']}: {r['issue_text']}\n")
                  s.write("\n")
              if high:
                  s.write(f"### :x: HIGH severity ({len(high)} findings)\n\n")
                  for r in high:
                      s.write(f"- `{r['filename']}:{r['line_number']}` — {r['test_id']}: {r['issue_text']}\n")
              if not high and not medium:
                  s.write(":white_check_mark: No issues found.\n")

          if high:
              print(f"::error::bandit detected {len(high)} HIGH severity issue(s). Failing.")
              sys.exit(1)
          elif medium:
              print(f"::warning::{len(medium)} MEDIUM severity issue(s) found (not failing).")
          else:
              print("No issues found.")
          EOF

      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: python/bandit-report.json
