# Pre-commit Hook Configuration for StockFixer
#
# コミット前に自動的に以下のチェックと修正を実行する：
# - コード品質チェック (pylint, flake8)
# - 型チェック (mypy)
# - コードフォーマット (black)
# - トレーリング空白・改行の修正

# インストール方法:
#   pip install pre-commit
#   pre-commit install
#   pre-commit install --hook-type pre-commit --hook-type commit-msg
#
# 手動実行:
#   pre-commit run --all-files
#
# 一時スキップ (コミット時のみ):
#   git commit --no-verify
#
# フックの監視を無効化:
#   pre-commit uninstall

repos:
  # 1. 基本的なファイル問題の修正
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace              # トレーリング空白を削除
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer               # ファイル末尾の改行を修正
      - id: check-yaml                      # YAML構文をチェック
      - id: check-json                      # JSON構文をチェック
      - id: check-added-large-files         # 大きなファイルをブロック
        args: [--maxkb=5000]
      - id: check-merge-conflict            # マージコンフリクトをチェック
      - id: debug-statements                # debugステートメントを検出

  # 2. Python コードフォーマッタ (Black)
  - repo: https://github.com/psf/black
    rev: 26.5.0
    hooks:
      - id: black
        language_version: python3
        args: [--line-length=100]

  # 3. Python インポート整理 (isort)
  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: [--settings-path=python]

  # 4. Python コード品質チェック (Flake8)
  - repo: https://github.com/PyCQA/flake8
    rev: 6.1.0
    hooks:
      - id: flake8
        exclude: ^\.github/skills/
        args: [
          --max-line-length=100,
          "--extend-ignore=E203,W503,D100,D101,D102,D103,D104,D105,D107,D200,D205,D400,D403,B007",
          "--exclude=__pycache__,.venv,.git,./venv,.github/skills"
        ]
        additional_dependencies:
          - flake8-docstrings
          - flake8-bugbear

  # 5. Python 型チェック (mypy)
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.7.1
    hooks:
      - id: mypy
        args: [--ignore-missing-imports, --implicit-optional, --follow-imports=silent, --explicit-package-bases]
        additional_dependencies:
          - types-requests
          - types-PyYAML
          - pandas-stubs
        exclude: ^(tests/|.*_test\.py$|\.github/skills/)

  # 6. Python コード品質メトリクス (Pylint) - Phase 1: エラー(E*)のみ
  # .pylintrc で C/R/W カテゴリを無効化し、E カテゴリのみ有効化
  # repo: local を使用して Git バージョン問題を回避
  - repo: local
    hooks:
      - id: pylint
        name: Pylint (errors only)
        entry: pylint
        language: python
        pass_filenames: false
        args: [python/src/, --rcfile=python/.pylintrc]
        files: ^python/src/.*\.py$
        exclude: ^(tests/|.*_test\.py$|\.github/skills/)
        additional_dependencies: [pylint]

  # 7. ロック問題検出 - DuckDB並行処理
  # DB write 競合、排他ロック漏れなどを検出
  - repo: local
    hooks:
      - id: check-duckdb-concurrency
        name: DuckDB Concurrency Issues
        entry: python ./.github/hooks/check_duckdb_concurrency.py
        language: python
        stages: [pre-commit]
        files: \.(py)$
        exclude: ^(tests/|python/tests/|\.github/hooks/|python/\.github/hooks/)
        pass_filenames: true

  # 8. ロック問題検出 - ファイルロック
  # 並列ファイル操作でのロック漏れを検出
  - repo: local
    hooks:
      - id: check-file-lock
        name: File Lock Issues
        entry: python ./.github/hooks/check_file_lock.py
        language: python
        stages: [pre-commit]
        files: \.(py)$
        exclude: ^(tests/|python/tests/|\.github/hooks/|python/\.github/hooks/)
        pass_filenames: true

  # 9. アーキテクチャ違反検出 - 旧モジュール経由 import
  # src.data.* / src.models.* 等の廃止パス経由 import を検出
  - repo: local
    hooks:
      - id: import-linter
        name: Import Linter (layer / independence contracts)
        entry: python .github/hooks/run_import_linter.py
        language: python
        additional_dependencies: ["import-linter>=2.0"]
        stages: [pre-commit]
        pass_filenames: false
        files: ^python/src/.*\.py$

      - id: check-arch-violation
        name: Architecture Violation (legacy module imports)
        entry: python ./.github/hooks/check_arch_violation.py
        language: python
        stages: [pre-commit]
        files: \.(py)$
        exclude: ^(tests/|python/tests/|\.github/hooks/|python/\.github/hooks/)
        pass_filenames: true

  # 10. コミットメッセージ検証 (commitlint スタイル)
  # コミットメッセージが "feat:", "fix:", "docs:" などで始まることを確認
  - repo: local
    hooks:
      - id: check-commit-message
        name: Check commit message format
        entry: python ./.github/hooks/check_commit_message.py
        language: python
        stages: [commit-msg]

# グローバル設定
default_language_version:
  python: python3
fail_fast: false
exclude: ^(\.venv/|venv/|__pycache__/|\.git/|\.mypy_cache/)
