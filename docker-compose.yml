services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: always
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  postgres:
    image: postgres:16-alpine
    container_name: stockfixer-postgres
    restart: always
    environment:
      - POSTGRES_DB=stockfixer
      - POSTGRES_USER=stockfixer
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-stockfixer_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockfixer -d stockfixer"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ローカル開発・ローカルpytest実行専用のテストDB。本番の `postgres`（5432）
  # とは別ポート・別ボリュームで完全に分離する。`stockfixer` アプリサービスは
  # 一切参照しない（depends_on に含めない）。
  #
  # get_database_url() のデフォルト値がこのサービスのポート（5433）を指すため、
  # DATABASE_URL を明示的に指定しない限り、ローカルでの `pytest` 実行は常に
  # このテスト専用インスタンスに繋がる（本番postgresが同じホストの5432で
  # 稼働中でも、ポートが違うため誤って本番に到達することがない）。
  postgres-test:
    image: postgres:16-alpine
    container_name: stockfixer-postgres-test
    restart: unless-stopped
    environment:
      - POSTGRES_DB=stockfixer
      - POSTGRES_USER=stockfixer
      - POSTGRES_PASSWORD=stockfixer_dev
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockfixer -d stockfixer"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  stockfixer:
    build:
      context: ./python
      dockerfile: Dockerfile
      args:
        - BUILD_DATE=${BUILD_DATE:-unknown}
        - GIT_COMMIT=${GIT_COMMIT:-unknown}
        - VERSION=${VERSION:-dev}
    image: stockfixer:${VERSION:-dev}
    container_name: stockfixer
    restart: always
    depends_on:
      ollama:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      - LOG_FORMAT=json
      - LOG_DIR=/app/logs
      - OLLAMA_URL=http://ollama:11434
      - DATABASE_URL=postgresql://stockfixer:${POSTGRES_PASSWORD:-stockfixer_dev}@postgres:5432/stockfixer
      - FACTORY_SANDBOX_IMAGE=stockfixer:${VERSION:-dev}
    env_file:
      - ./python/.env
    volumes:
      # データ・モデル・結果をホスト側に永続化
      # data/ には stockfixer.duckdb と backups/ サブディレクトリが含まれる
      - ./python/data:/app/data
      - ./python/models:/app/models
      - ./python/results:/app/results
      - ./Logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      resources:
        limits:
          cpus: "8"
          memory: 8g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request, sys; r=urllib.request.urlopen('http://localhost:5100/health',timeout=8); sys.exit(0 if r.status==200 else 1)\""]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    tty: true

volumes:
  ollama_data:
  postgres_data:
  postgres_test_data:
