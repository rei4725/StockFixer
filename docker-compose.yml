services:
  stockfixer:
    build:
      context: ./python
      dockerfile: Dockerfile
      args:
        - BUILD_DATE=${BUILD_DATE:-unknown}
        - GIT_COMMIT=${GIT_COMMIT:-unknown}
        - VERSION=${VERSION:-dev}
    image: stockfixer:${VERSION:-dev}
    container_name: stockfixer
    restart: always
    environment:
      - LOG_FORMAT=json
    env_file:
      - ./python/.env
    volumes:
      # データ・モデル・結果をホスト側に永続化
      - ./python/data:/app/data
      - ./python/models:/app/models
      - ./python/results:/app/results
      - ./Logs:/app/logs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    tty: true
