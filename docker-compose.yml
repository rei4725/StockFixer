services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: always
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  stockfixer:
    build:
      context: ./python
      dockerfile: Dockerfile
      args:
        - BUILD_DATE=${BUILD_DATE:-unknown}
        - GIT_COMMIT=${GIT_COMMIT:-unknown}
        - VERSION=${VERSION:-dev}
    image: stockfixer:${VERSION:-dev}
    container_name: stockfixer
    restart: always
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - LOG_FORMAT=json
      - OLLAMA_URL=http://ollama:11434
    env_file:
      - ./python/.env
    volumes:
      # データ・モデル・結果をホスト側に永続化
      # data/ には stockfixer.duckdb と backups/ サブディレクトリが含まれる
      - ./python/data:/app/data
      - ./python/models:/app/models
      - ./python/results:/app/results
      - ./Logs:/app/logs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request, sys; r=urllib.request.urlopen('http://localhost:5100/health',timeout=8); sys.exit(0 if r.status==200 else 1)\""]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    tty: true

volumes:
  ollama_data:
